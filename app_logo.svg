<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Titanium Obsidian Black Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922" />
      <stop offset="50%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#08090D" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle (Apple/Android Standard Superellipse) -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGradient)" />

  <!-- Subtle Outer Edge Ring -->
  <rect width="510" height="510" x="1" y="1" rx="114" ry="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <!-- Main Speech Bubble & Waves Group -->
  <g filter="url(#subtleGlow)">
    <!-- 1. Pure White Speech Bubble Body -->
    <rect x="88" y="160" width="308" height="216" rx="72" ry="72" fill="#FFFFFF" />

    <!-- 2. Speech Bubble Tail -->
    <path d="M 110,345 L 82,410 C 80,415 88,420 95,417 L 175,372 Z" fill="#FFFFFF" />

    <!-- 3. Signal Wave 1 (Inner Wave) -->
    <path d="M 345,170 A 130,130 0 0,1 428,245" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />

    <!-- 4. Signal Wave 2 (Outer Wave) -->
    <path d="M 370,126 A 180,180 0 0,1 475,225" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />

    <!-- 5. "MQTT" Crisp Typographic Cutout -->
    <!-- M -->
    <path d="M 136,305 L 136,232 L 155,232 L 174,272 L 193,232 L 212,232 L 212,305 L 197,305 L 197,258 L 179,295 L 169,295 L 151,258 L 151,305 Z" fill="#0D0F14" />
    
    <!-- Q -->
    <path d="M 226,268.5 C 226,246 238,232 258,232 C 278,232 290,246 290,268.5 C 290,291 278,305 258,305 C 238,305 226,291 226,268.5 Z M 242.5,268.5 C 242.5,283 248.5,292.5 258,292.5 C 267.5,292.5 273.5,283 273.5,268.5 C 273.5,254 267.5,244.5 258,244.5 C 248.5,244.5 242.5,254 242.5,268.5 Z" fill="#0D0F14" />
    <path d="M 268,288 L 291,313 L 281,320 L 259,297 Z" fill="#0D0F14" />

    <!-- T (First) -->
    <path d="M 296,232 L 334,232 L 334,247 L 323,247 L 323,305 L 307,305 L 307,247 L 296,247 Z" fill="#0D0F14" />

    <!-- T (Second) -->
    <path d="M 338,232 L 376,232 L 376,247 L 365,247 L 365,305 L 349,305 L 349,247 L 338,247 Z" fill="#0D0F14" />
  </g>
</svg>
