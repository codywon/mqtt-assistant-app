<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Titanium Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922" />
      <stop offset="50%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#08090D" />
    </linearGradient>

    <!-- Outer Rim Subtle Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Primary M Ribbon Gradient (Pure Crisp White to Cool Steel) -->
    <linearGradient id="ribbonLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="ribbonRight" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Emerald Pulse Core Glow -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="pulseCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Layering -->
    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (iOS / Modern Android Adaptive Base) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2" />

  <!-- Precision Technical Background Rings & Guides -->
  <g opacity="0.18">
    <!-- Concentric Target Guides -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="4 8" />
    <circle cx="256" cy="256" r="130" fill="none" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="256" cy="256" r="70" fill="none" stroke="#10B981" stroke-width="1.2" />
    <!-- Diagonal Precision Crosshairs -->
    <line x1="126" y1="126" x2="166" y2="166" stroke="#FFFFFF" stroke-width="1" />
    <line x1="386" y1="126" x2="346" y2="166" stroke="#FFFFFF" stroke-width="1" />
    <line x1="126" y1="386" x2="166" y2="346" stroke="#FFFFFF" stroke-width="1" />
    <line x1="386" y1="386" x2="346" y2="346" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Central Broker Aura Pulse Glow -->
  <circle cx="256" cy="256" r="88" fill="url(#pulseGlow)" />

  <!-- Main Isometric Nexus Glyph: Futuristic Geometric "M" Interconnect -->
  <g filter="url(#shadowDepth)">
    <!-- Left Wing Stream (Publish Loop) -->
    <path d="M 132 356
             L 132 208
             C 132 186, 148 168, 170 168
             C 184 168, 196 176, 204 188
             L 256 266
             L 220 266
             L 178 202
             C 174 196, 168 194, 162 194
             C 155 194, 150 199, 150 206
             L 150 356
             Z"
          fill="url(#ribbonLeft)" />

    <!-- Right Wing Stream (Subscribe Loop) -->
    <path d="M 380 356
             L 380 208
             C 380 186, 364 168, 342 168
             C 328 168, 316 176, 308 188
             L 256 266
             L 292 266
             L 334 202
             C 338 196, 344 194, 350 194
             C 357 194, 362 199, 362 206
             L 362 356
             Z"
          fill="url(#ribbonRight)" />

    <!-- Dynamic Central Confluence Chevron -->
    <path d="M 206 312
             L 256 238
             L 306 312
             L 282 328
             L 256 288
             L 230 328
             Z"
          fill="#FFFFFF"
          opacity="0.95" />

    <!-- Horizontal Bus Line (Underneath Core) -->
    <line x1="168" y1="356" x2="344" y2="356" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Glowing Broker Core (IoT Pulse Node) -->
  <g>
    <!-- Outer Emerald Orbit Ring -->
    <circle cx="256" cy="256" r="22" fill="#0F1117" stroke="#10B981" stroke-width="4.5" />
    <!-- Bright Center Pulse Node -->
    <circle cx="256" cy="256" r="11" fill="url(#pulseCore)" />
    <!-- Center Specular Highlight -->
    <circle cx="252" cy="252" r="3.5" fill="#FFFFFF" opacity="0.85" />
  </g>

  <!-- Precision Satellite Nodes (Telemetry Endpoints) -->
  <!-- Left Endpoint Node -->
  <circle cx="132" cy="356" r="9" fill="#0F1117" stroke="#F8FAFC" stroke-width="4" />
  <circle cx="132" cy="356" r="3.5" fill="#10B981" />

  <!-- Right Endpoint Node -->
  <circle cx="380" cy="356" r="9" fill="#0F1117" stroke="#F8FAFC" stroke-width="4" />
  <circle cx="380" cy="356" r="3.5" fill="#10B981" />

  <!-- Top Left Signal Pulse Node -->
  <circle cx="170" cy="168" r="6" fill="#F8FAFC" />

  <!-- Top Right Signal Pulse Node -->
  <circle cx="342" cy="168" r="6" fill="#F8FAFC" />
</svg>
